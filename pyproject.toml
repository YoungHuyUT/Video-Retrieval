[project]
name = "aic2026"
version = "0.1.0"
description = "Video retrieval, VQA, and temporal alignment starter for AIC 2026"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "streamlit>=1.36",
  "httpx>=0.27",
  "rank-bm25>=0.2",
]

[project.optional-dependencies]
retrieval = ["faiss-cpu>=1.8", "chromadb>=0.5"]
models = ["torch>=2.3", "open-clip-torch>=2.24", "transformers>=4.49", "qwen-vl-utils>=0.0.8", "sentence-transformers>=3.0"]
video = ["opencv-python-headless>=4.10", "pillow>=10.0"]
asr = ["faster-whisper>=1.0.0"]
agent = []
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
aic2026 = "aic2026.cli:app"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aic2026.agent" = ["templates/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# `typer.Option(...)` in argument defaults is the canonical Typer pattern.
"src/aic2026/cli.py" = ["B008", "B006"]

[dependency-groups]
dev = [
    "pdfplumber>=0.11.10",
]
