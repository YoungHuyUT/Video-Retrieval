dataset:
  raw_dir: data/raw
  processed_dir: data/processed
  index_dir: data/indexes
  official_assets:
    - Videos
    - Keyframes
    - Objects
    - CLIP features
    - Metadata
retrieval:
  candidate_frames: 500
  candidate_videos: 100
  max_answers: 100
  frames_per_video: 7
encoders:
  btc_clip:
    architecture: clip_vit_b_32
    purpose: "Truy vấn feature CLIP do BTC cung cấp; text encoder phải đúng checkpoint"
  generated_siglip2:
    architecture: siglip2_base_patch16_224
    model_id: google/siglip2-base-patch16-224
    purpose: "Tự tạo feature từ Video và truy vấn cùng model"
submission:
  format: jsonl
  max_answers: 100
tasks:
  registered:
    - kis
    - qa
    - trake
  extension_contract: "Đăng ký handler vào aic2026.tasks.default_registry"
agent:
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: llama3.2:3b
  system_prompt_template: src/aic2026/agent/templates/system_agent_en.md
  timeout_seconds: 120
  max_tool_rounds: 4
  enabled: true
