# LLM local chỉ lập kế hoạch và đánh giá evidence; không được tạo video_id/frame_id ngoài tool output.
agent:
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: llama3.2:3b
  system_prompt_template: src/aic2026/agent/templates/system_agent_en.md
  timeout_seconds: 120
  max_tool_rounds: 4
  temperature: 0.1
  retrieval_candidates: 300
  answers_per_query: 100
